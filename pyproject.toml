[tool.poetry]
name = "speaktranslate"
version = "0.1.0"
description = "Captura áudio do microfone, detecta o idioma, transcreve, traduz e reproduz o resultado em áudio"
authors = ["José Barreto"]
license = "GPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
faster-whisper = "^1.2.1"
numpy = ">=1.26,<2.0"
sounddevice = "0.4.6"
soundfile = "0.12.1"
webrtcvad-wheels = "2.0.11.post1"
deep-translator = "^1.11.4"
edge-tts = "^7.2.8"
playsound = "1.2.2"
setuptools = "<82"
pyobjc-framework-Cocoa = {version = "*", markers = "sys_platform == 'darwin'"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
