[tool.poetry]
name = "speaktranslate"
version = "0.1.0"
description = "Captura áudio do microfone, detecta o idioma, transcreve, traduz e reproduz o resultado em áudio"
authors = ["José Barreto"]
license = "GPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
faster-whisper = "^1.2.1"
numpy = ">=1.26,<2.0"
sounddevice = "0.4.6"
soundfile = "0.12.1"
webrtcvad-wheels = "2.0.11.post1"
edge-tts = "^7.2.8"
setuptools = "<82"
ctranslate2 = "^4.8.1"
transformers = ">=4.44,<6.0"
sentencepiece = "^0.2.0"
sacremoses = "^0.1.1"
torch = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
