[tool.poetry]
name = "speaktranslate"
version = "0.1.0"
description = "Captura áudio do microfone, detecta o idioma, transcreve, traduz e reproduz o resultado em áudio"
authors = ["José Barreto"]
license = "GPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
faster-whisper = "^1.2.1"
numpy = ">=1.26,<2.0"
sounddevice = "0.4.6"
soundfile = "0.12.1"
webrtcvad-wheels = "2.0.11.post1"
edge-tts = "^7.2.8"
setuptools = "<82"
ctranslate2 = "^4.8.1"
transformers = ">=4.44,<6.0"
sentencepiece = "^0.2.0"
sacremoses = "^0.1.1"
torch = "^2.0"
piper-tts = "^1.7.0"
google-genai = "^1.2.0"
# Detecção do idioma de um texto digitado (não áudio), usada na aba
# "Microfone Virtual" para decidir se precisa traduzir antes de falar. Preso
# em "<0.3.0" porque as versões seguintes (0.3.0+) exigem numpy>=2.0, que
# conflita com o numpy<2.0 fixado acima (por causa do faster-whisper/ctranslate2).
py3langid = ">=0.2.2,<0.3.0"
# Kokoro depende do pacote "misaki", que não dá suporte a Python 3.13 em
# nenhuma versão recente (trava em "<3.13" desde a 0.7.5) — por isso restrito
# a Python 3.11/3.12 via marcador abaixo. Em Python 3.13+, o Poetry
# simplesmente pula essas duas dependências (não trava o `poetry install`) e
# o motor "Kokoro (local)" fica indisponível na interface (erro tratado, ver
# tts.py) até rodar o projeto numa venv 3.11/3.12.
kokoro = {version = "^0.9.4", python = ">=3.11,<3.13"}
# O extra "ja" do misaki traz o pyopenjtalk (compila C/C++ nativo via cmake)
# para dar suporte a japonês — removido porque o toolchain de compilação C
# deste Mac (Xcode Command Line Tools/SDK) falha nesse build específico
# ("tapi error: malformed file"). Sem ele, o Kokoro perde a voz japonesa,
# mas ganha inglês/espanhol/francês/italiano/português/chinês sem problema
# (nenhum deles precisa de extensão nativa). Ver README, seção "Texto-para-voz".
misaki = {version = "^0.9.4", extras = ["zh"], python = ">=3.11,<3.13"}
# Cliente do protocolo obs-websocket v5, usado pela aba "Entrevista" para
# controlar um OBS Studio já instalado (câmera virtual via Camera Extension
# do OBS, em vez de desenvolvermos uma extensão de sistema própria — ver
# README, seção "Aba Entrevista").
obsws-python = ">=1.6,<2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
