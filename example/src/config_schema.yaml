# Opções de configuração dos modelos Whisper
model_options:
  use_api:
    value: false
    type: bool
    description: "Alterna entre usar a API da OpenAI ou um modelo Voice local para transcrição."

  # Opções comuns a ambos os modelos (API e local)
  common:
    language:
      value: null
      type: str
      description: "O código de idioma para a transcrição no formato ISO-639-1."
    temperature:
      value: 0.0
      type: float
      description: "Controla a aleatoriedade da saída da transcrição. Valores mais baixos tornam a saída mais focada e determinística."
    initial_prompt:
      value: null
      type: str
      description: "Uma string usada como prompt inicial para condicionar a transcrição. Mais informações: https://platform.openai.com/docs/guides/speech-to-text/prompting"

  # Opções de configuração para a API da OpenAI
  api:
    model:
      value: whisper-1
      type: str
      description: "O modelo a ser usado para transcrição. Atualmente, apenas 'whisper-1' está disponível."
    base_url:
      value: https://api.openai.com/v1
      type: str
      description: "A URL base da API. Pode ser alterada para usar um endpoint de API local."
    api_key:
      value: null
      type: str
      description: "Sua chave de API da OpenAI. Necessária para uso não local da API."

  # Opções de configuração para o modelo faster-whisper
  local:
    model:
      value: base
      type: str
      description: "O modelo a ser usado para transcrição. Modelos maiores oferecem melhor precisão, mas são mais lentos."
      options:
        - base
        - base.en
        - tiny
        - tiny.en
        - small
        - small.en
        - medium
        - medium.en
        - large
        - large-v1
        - large-v2
        - large-v3
    device:
      value: auto
      type: str
      description: "O dispositivo para executar o modelo Voice local. Use 'cuda' para GPUs NVIDIA, 'cpu' para processamento somente por CPU, ou 'auto' para escolher automaticamente o melhor dispositivo disponível."
      options:
        - auto
        - cuda
        - cpu
    compute_type:
      value: default
      type: str
      description: "O tipo de computação para o modelo Voice local."
      options:
        - default
        - float32
        - float16
        - int8
    condition_on_previous_text:
      value: true
      type: bool
      description: "Defina como true para usar o texto transcrito anteriormente como prompt para a próxima requisição de transcrição."
    vad_filter:
      value: false
      type: bool
      description: "Defina como true para usar um filtro de detecção de atividade de voz (VAD) para remover silêncio da gravação."
    model_path:
      value: null
      type: str
      description: "O caminho para o modelo Voice local. Se não especificado, o modelo padrão será baixado."

# Opções de configuração para ativação e gravação
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "O atalho de teclado para ativar o processo de gravação e transcrição. Separe as teclas com '+'."
  input_backend:
    value: auto
    type: str
    description: "O backend de entrada para detectar pressionamentos de tecla. 'auto' tentará usar o melhor backend disponível."
    options:
      - auto
      - evdev
      - pynput
  recording_mode:
    value: continuous
    type: str
    description: "O modo de gravação a ser usado. Opções: continuous (reinicia automaticamente após pausa na fala até pressionar o atalho novamente), voice_activity_detection (para após pausa na fala), press_to_toggle (para ao pressionar o atalho novamente), hold_to_record (para ao soltar o atalho)."
    options:
      - continuous
      - voice_activity_detection
      - press_to_toggle
      - hold_to_record
  sound_device:
    value: null
    type: str
    description: "O índice numérico do dispositivo de som a ser usado para gravação. Para encontrar os números dos dispositivos, execute `python -m sounddevice`"
  sample_rate:
    value: 16000
    type: int
    description: "A taxa de amostragem em Hz para gravação."
  silence_duration:
    value: 900
    type: int
    description: "A duração em milissegundos para aguardar o silêncio antes de parar a gravação."
  min_duration:
    value: 100
    type: int
    description: "A duração mínima em milissegundos para que uma gravação seja processada. Gravações mais curtas serão descartadas."
  enable_audio_enhancement:
    value: true
    type: bool
    description: "Aplica filtros de áudio antes da transcrição para reduzir ruído e melhorar a precisão."
  highpass_cutoff_hz:
    value: 80
    type: int
    description: "Frequência de corte do filtro passa-alta em Hz. Remove rumble e ruído grave (ventilador, mesa). Use 0 para desativar."
  noise_reduction_strength:
    value: 0.75
    type: float
    description: "Intensidade da redução de ruído (0.0 = desligado, 1.0 = máximo). Estima o ruído ambiente no início da gravação."
  noise_profile_ms:
    value: 300
    type: int
    description: "Milissegundos iniciais usados para estimar o perfil de ruído ambiente."
  normalize_audio:
    value: true
    type: bool
    description: "Normaliza o volume do áudio antes da transcrição."

# Comandos de voz, dicionário pessoal e edições automáticas
text_transforms:
  enable_voice_commands:
    value: true
    type: bool
    description: "Ativa comandos de voz com prefixo (ex.: 'comando enter')."
  command_prefix:
    value: comando
    type: str
    description: "Palavra que precede o comando de voz."
  custom_voice_commands:
    value: []
    type: list
    description: "Comandos personalizados: gatilho → ação de tecla."
  personal_dictionary:
    value: []
    type: list
    description: "Substituições de palavras difíceis de transcrever."
  auto_edits:
    value: []
    type: list
    description: "Regras de localizar/substituir aplicadas após o dicionário."

# Opções de pós-processamento do texto transcrito
post_processing:
  writing_key_press_delay:
    value: 0.005
    type: float
    description: "O atraso em segundos entre cada pressionamento de tecla ao escrever o texto transcrito."
  remove_trailing_period:
    value: false
    type: bool
    description: "Defina como true para remover o ponto final do texto transcrito."
  add_trailing_space:
    value: true
    type: bool
    description: "Defina como true para adicionar um espaço ao final do texto transcrito."
  remove_capitalization:
    value: false
    type: bool
    description: "Defina como true para converter o texto transcrito para letras minúsculas."
  input_method:
    value: auto
    type: str
    description: "Método para inserir o texto transcrito. 'auto' usa xdotool no Linux (recomendado). Instale: sudo apt install xdotool xclip"
    options:
      - auto
      - clipboard
      - xdotool
      - pynput
      - ydotool
      - dotool

# Configurações diversas
misc:
  print_to_terminal:
    value: true
    type: bool
    description: "Defina como true para imprimir o status do script e o texto transcrito no terminal."
  hide_status_window:
    value: false
    type: bool
    description: "Defina como true para ocultar a janela de status durante a operação."
  noise_on_completion:
    value: false
    type: bool
    description: "Defina como true para reproduzir um som após o texto transcrito ser digitado."
  show_audio_visualizer:
    value: true
    type: bool
    description: "Exibe barras de equalizador na janela de status durante a gravação."
